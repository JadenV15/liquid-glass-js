<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>liquid-glass-js demo</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background:
          radial-gradient(1200px 500px at 15% 10%, rgba(80, 113, 195, 0.22), transparent 62%),
          radial-gradient(900px 420px at 86% 90%, rgba(36, 120, 126, 0.2), transparent 62%),
          #07090f;
        color: #eceff5;
        font-family: "Segoe UI", system-ui, sans-serif;
      }

      .wrap {
        max-width: 1120px;
        margin: 0 auto;
        padding: 42px 24px 28px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(22px, 3vw, 34px);
        font-weight: 600;
      }

      .sub {
        margin: 0 0 24px;
        opacity: 0.8;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(210px, 1fr));
        gap: 20px;
      }

      .card {
        border-radius: 18px;
        padding: 14px;
        background: rgba(255, 255, 255, 0.03);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.08),
          0 20px 50px rgba(0, 0, 0, 0.35);
      }

      .title {
        margin: 0 0 10px;
        font-size: 14px;
        opacity: 0.88;
      }

      .glass {
        width: 100%;
        height: min(58vh, 420px);
        min-height: 280px;
        border-radius: 14px;
        overflow: hidden;
      }

      @media (max-width: 940px) {
        .grid {
          grid-template-columns: 1fr;
        }

        .glass {
          height: min(54vh, 360px);
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
          "three/examples/jsm/": "https://unpkg.com/three@0.180.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main class="wrap">
      <h1>liquid-glass-js</h1>
      <p class="sub">Three static glass primitives with shared sizing and material controls.</p>

      <section class="grid">
        <article class="card">
          <h2 class="title">drawLiquidCapsule</h2>
          <div id="glass-capsule" class="glass"></div>
        </article>
        <article class="card">
          <h2 class="title">drawLiquidRect</h2>
          <div id="glass-rect" class="glass"></div>
        </article>
        <article class="card">
          <h2 class="title">drawLiquidEllipse</h2>
          <div id="glass-ellipse" class="glass"></div>
        </article>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
