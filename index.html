<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>liquid-glass-js demo</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: radial-gradient(circle at top, #151515, #050505 60%);
        color: #efefef;
        font-family: Inter, system-ui, sans-serif;
      }

      .wrap {
        height: 100%;
        display: grid;
        place-items: center;
      }

      #glass {
        width: min(34vw, 260px);
        height: min(74vh, 520px);
        min-width: 180px;
        min-height: 340px;
        border-radius: 22px;
        overflow: hidden;
        box-shadow:
          inset 0 0 0 1px rgba(255,255,255,0.05),
          0 30px 80px rgba(0,0,0,0.45);
      }

      .label {
        position: fixed;
        left: 16px;
        bottom: 12px;
        opacity: 0.7;
        font-size: 12px;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
          "three/examples/jsm/": "https://unpkg.com/three@0.180.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div class="wrap">
      <div id="glass"></div>
      <div class="label">liquid-glass-js demo (static tube)</div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
